name: Publish public website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only public website files
        run: |
          mkdir -p _site
          cp -R assets _site/
          cp index.html 404.html CNAME .nojekyll robots.txt sitemap.xml llms.txt styles.css script.js ads-conversions.js _site/
          test ! -e _site/guincho-marquizelli-social
          test -z "$(find _site -name .env -o -name '*.ts' -o -name '*.yml')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

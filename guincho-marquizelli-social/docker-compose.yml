services:
  app:
    build: .
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: guincho_social
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      APP_ENV: dry-run
      APP_HOST: "0.0.0.0"
      ENABLE_REAL_PUBLISHING: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./public-media:/app/public-media
      - ./.state:/app/.state
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guincho_social
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guincho_social"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
